name: security

on:
  schedule:
    # Mondays 06:00 UTC — early morning before anyone needs CI for PRs.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    # Run on PR when the dependency graph or security config changes.
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/security.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev,obs,excel,viz,mcmc,data,jax]"

      - name: bandit
        run: |
          source .venv/bin/activate
          bandit -c pyproject.toml -r src/

      - name: pip-audit
        run: |
          source .venv/bin/activate
          pip-audit --strict

      - name: OSV scanner
        uses: google/osv-scanner-action/osv-scanner-action@v1
        with:
          scan-args: |-
            --recursive
            --skip-git
            ./
        continue-on-error: true
