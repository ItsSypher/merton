name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        # 3.11 = stated floor (pyproject.toml `requires-python`).
        # 3.14 = current stable (released 2025-10-07).
        # 3.15 is still in alpha (PEP 790); revisit when 3.15.0 ships in 2026-10.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install package
        # Installing the same extras locally as CLAUDE.md prescribes
        # keeps coverage above the 90 % gate (otherwise obs / excel /
        # mcmc / jax modules would only have skips) and lets mypy
        # resolve their stubs in the lint job too. Platform-gated
        # extras (gpu, mlx, bloomberg) intentionally stay out.
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev,obs,excel,viz,mcmc,data,jax]"
      - name: Run tests
        shell: bash
        run: |
          source .venv/bin/activate || source .venv/Scripts/activate
          pytest -n auto --cov=merton --cov-report=xml
      - uses: codecov/codecov-action@v4
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        with:
          file: ./coverage.xml

  free-threaded:
    # Forward-looking check that merton works on PEP 779 free-threaded
    # CPython. Numba 0.63 (2025-12) shipped initial free-threading
    # support but `llvmlite` doesn't publish a free-threaded wheel yet
    # and its sdist build fails on the stock GH runner (no LLVM dev
    # headers). Until llvmlite publishes a 3.14t wheel, this job is
    # informational — not a release blocker.
    name: pytest (free-threaded Python 3.14t — non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Set up free-threaded Python 3.14t
        run: uv python install 3.14t
      - name: Install package
        run: |
          uv venv --python 3.14t
          uv pip install -e ".[dev]"
      - name: Verify GIL is disabled
        run: |
          source .venv/bin/activate
          python -c "import sys; assert not sys._is_gil_enabled(), 'expected GIL-free build'; print('GIL disabled OK')"
      - name: Run unit tests under free-threading
        run: |
          source .venv/bin/activate
          # -p no:randomly because free-threaded runs can still expose
          # race conditions; -n auto for parallel pytest workers.
          pytest tests/unit tests/property tests/golden -q -n auto --no-cov
