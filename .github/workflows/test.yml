name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install package
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"
      - name: Run tests
        shell: bash
        run: |
          source .venv/bin/activate || source .venv/Scripts/activate
          pytest -n auto --cov=merton --cov-report=xml
      - uses: codecov/codecov-action@v4
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        with:
          file: ./coverage.xml

  free-threaded:
    name: pytest (free-threaded Python 3.13t)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Set up free-threaded Python 3.13t
        run: uv python install 3.13t
      - name: Install package
        run: |
          uv venv --python 3.13t
          uv pip install -e ".[dev]"
      - name: Verify GIL is disabled
        run: |
          source .venv/bin/activate
          python -c "import sys; assert not sys._is_gil_enabled(), 'expected GIL-free build'; print('GIL disabled OK')"
      - name: Run unit tests under free-threading
        run: |
          source .venv/bin/activate
          # -p no:randomly because the free-threaded run can still expose race conditions;
          # -n auto for parallel pytest workers.
          pytest tests/unit tests/property tests/golden -q -n auto --no-cov
