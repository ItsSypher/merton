name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv python install 3.12
      - name: Install dev deps
        # mypy needs the optional packages installed to resolve their
        # stubs (opentelemetry, fastapi, jax). Without them every public
        # function that touches an optional dep blows up under `strict`.
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev,obs,excel,viz,mcmc,data,jax]"
      - name: ruff format
        run: |
          source .venv/bin/activate
          ruff format --check .
      - name: ruff lint
        run: |
          source .venv/bin/activate
          ruff check .
      # mypy is intentionally not a hard gate yet. The codebase has full
      # type annotations but hits ~95 strict errors at numpy / pandas
      # boundaries; cleanup is tracked for the 1.x typing pass. Re-enable
      # this step once `mypy src/merton` returns 0 locally.
      # - name: mypy
      #   run: |
      #     source .venv/bin/activate
      #     mypy src/merton
      - name: codespell
        run: |
          source .venv/bin/activate
          codespell src tests docs README.md
      - name: bandit
        run: |
          source .venv/bin/activate
          bandit -c pyproject.toml -r src/
