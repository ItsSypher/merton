name: wheels

# Build the universal wheel + sdist on every tag push, then publish to
# PyPI via Trusted Publishing (no API tokens — OIDC against the `pypi`
# environment configured at .github/settings → Environments).
#
# `merton` is a pure-Python package (no C extensions; numba is a runtime
# JIT, not a build-time compile). hatchling produces a single
# `merton-<version>-py3-none-any.whl` that works on every supported
# platform / Python version. No cibuildwheel matrix needed; cross-
# platform smoke is handled by `tests.yml` on every push.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # required for PyPI Trusted Publishing

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # hatch-vcs needs full history to derive the version

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - run: uv python install 3.12

      - name: Build sdist + wheel
        run: |
          uv venv --python 3.12
          uv pip install build
          .venv/bin/python -m build

      - name: Inspect dist artifacts
        run: ls -la dist/

      - name: Smoke-test the wheel
        run: |
          # Install the wheel into a fresh interpreter and confirm it
          # imports + reports the correct version. Catches a botched
          # build (broken metadata, missing modules) before we publish.
          uv venv --clear --python 3.12 /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/python -c "import merton; print(f'merton {merton.__version__} imported OK')"
          # The CLI should also work end-to-end.
          /tmp/smoke/bin/merton --help > /dev/null

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    # Only publish from real tag pushes — never from workflow_dispatch.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
