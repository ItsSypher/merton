name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv python install 3.12
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[docs]"
      - name: Build Sphinx docs
        run: |
          source .venv/bin/activate
          # -n (nitpicky) catches broken cross-refs; --keep-going prints
          # every warning. We don't pass -W (warnings-as-errors) yet — too
          # many sphinx-autoapi `duplicate object description` warnings on
          # dataclass attributes; tracked for a docs-cleanup pass post-1.0.
          sphinx-build --keep-going -n -b html docs docs/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
