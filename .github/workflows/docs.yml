name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv python install 3.12
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[docs]"
      - name: Build Sphinx docs
        run: |
          source .venv/bin/activate
          # -W treats warnings as errors so a broken cross-reference fails
          # the build. -n (nitpicky) is what makes broken refs warn at all.
          # --keep-going prints every warning instead of stopping at the
          # first; useful when fixing a batch of refs.
          sphinx-build -W --keep-going -n -b html docs docs/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
